    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Lato:wght@400;700&display=block");

  <body>
    <div data-hf-id="hf-x3dq" id="root" data-composition-id="flash-through-white" data-start="0" data-duration="2" data-width="1920" data-height="1080">
      <style>
        #root {
          width: 1920px;

        }

        .bp-grid,

        /* Blueprint grid */

        }

        /* Layout */
        .bp-left {

          left: 0;

          bottom: 0;

          display: flex;
          align-items: center;
          justify-content: center;
        }
        .bp-right {
          position: absolute;
          right: 0;
          top: 0;
          bottom: 0;
          width: 720px;

      <div data-hf-id="hf-18hn" class="bp-grid"></div>

      <!-- GL demo scenes (captured as textures, then hidden) -->

        <div data-hf-id="hf-8jdh" class="scene-label" style="color: #ffba08">SCENE A</div>
      </div>
      <div data-hf-id="hf-daft" id="s2" class="scene" style="background: #ffba08; opacity: 0">

      <!-- GL canvas (left panel only) -->
      <canvas data-hf-id="hf-vv93" id="gl-canvas" width="1920" height="1080" style="
          position: absolute;
          top: 0;
          left: 0;
          width: 1920px;
          height: 1080px;
          z-index: 10;
          pointer-events: none;
          display: none;

      </canvas>

      <!-- Right panel metadata -->
      <div data-hf-id="hf-95jb" class="bp-right">
        <div data-hf-id="hf-gy6s" class="bp-name">Flash Through White</div>
        <div data-hf-id="hf-z20z" class="bp-plabel">Prompt</div>
        <div data-hf-id="hf-rqwk" class="bp-prompt">"use flash through white shader transition"</div>
        <div data-hf-id="hf-0kld" class="bp-desc">
          Both scenes brighten to a white midpoint. Works on dark backgrounds where
          color-dip-to-black is invisible.
        </div>

      <div data-hf-id="hf-zlur" id="driver" class="clip" data-start="0" data-duration="2" data-track-index="0" style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var glCanvas = document.getElementById("gl-canvas");
      var gl = glCanvas.getContext("webgl", { preserveDrawingBuffer: true });
      if (!gl) {
        console.warn("WebGL not available");
        window.__timelines["flash-through-white"] = gsap.timeline({ paused: true });
      } else {
        gl.viewport(0, 0, 1920, 1080);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
        function makeTexture(c1, c2, glow) {
          var c = document.createElement("canvas"); c.width = 1920; c.height = 1080;
          var ctx = c.getContext("2d");
          var g = ctx.createLinearGradient(0, 0, 1920, 1080);
          g.addColorStop(0, c1); g.addColorStop(0.5, c2); g.addColorStop(1, c1);
          ctx.fillStyle = g; ctx.fillRect(0, 0, 1920, 1080);
          var r = ctx.createRadialGradient(960, 540, 100, 960, 540, 900);
          r.addColorStop(0, glow); r.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = r; ctx.fillRect(0, 0, 1920, 1080);
          ctx.fillStyle = "rgba(255,255,255,0.03)";
          for (var y = 0; y < 1080; y += 48) for (var x = 0; x < 1920; x += 48) ctx.fillRect(x, y, 2, 2);
          var tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
          return tex;
        }

        var vertSrc =
          "attribute vec2 a_pos; varying vec2 v_uv; void main(){" +
          "v_uv=a_pos*0.5+0.5; v_uv.y=1.0-v_uv.y; gl_Position=vec4(a_pos,0,1);}";
        var quadBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
          gl.STATIC_DRAW,
        );
        function compileShader(src, type) {
          var s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
            console.error("Shader:", gl.getShaderInfoLog(s));
          return s;
        }
        function mkProg(fragSrc) {
          var p = gl.createProgram();
          gl.attachShader(p, compileShader(vertSrc, gl.VERTEX_SHADER));
          gl.attachShader(p, compileShader(fragSrc, gl.FRAGMENT_SHADER));
          gl.linkProgram(p);
          if (!gl.getProgramParameter(p, gl.LINK_STATUS))
            console.error("Link:", gl.getProgramInfoLog(p));
          return p;
        }

        var H =
          "precision mediump float;" +
          "varying vec2 v_uv;" +
          "uniform sampler2D u_from, u_to;" +
          "uniform float u_progress;" +
          "uniform vec2 u_resolution;\n";

        var progPass = mkProg(H + "void main(){gl_FragColor=texture2D(u_from,v_uv);}");
        var progTrans = mkProg(
          H +
            "void main(){vec4 A=texture2D(u_from,v_uv),B=texture2D(u_to,v_uv);float toWhite=smoothstep(0.,.45,u_progress);vec3 fromC=mix(A.rgb,vec3(1.),toWhite);float fromWhite=1.-smoothstep(.5,1.,u_progress);vec3 toC=mix(B.rgb,vec3(1.),fromWhite);gl_FragColor=vec4(mix(fromC,toC,smoothstep(.35,.65,u_progress)),1.);}",
        );

        function renderShader(prog, texFrom, texTo, progress) {
          gl.useProgram(prog);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, texFrom);
          gl.uniform1i(gl.getUniformLocation(prog, "u_from"), 0);
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, texTo);
          gl.uniform1i(gl.getUniformLocation(prog, "u_to"), 1);
          gl.uniform1f(gl.getUniformLocation(prog, "u_progress"), progress);
          gl.uniform2f(gl.getUniformLocation(prog, "u_resolution"), 1920, 1080);
          var pos = gl.getAttribLocation(prog, "a_pos");
          gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
          gl.enableVertexAttribArray(pos);
          gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        function easeInOut(p) {
          return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        }

        var texA = makeTexture("#000000", "#0a0a14", "rgba(136,255,103,0.08)");
        var texB = makeTexture("#0a0a1a", "#1a1040", "rgba(124,92,252,0.22)");
        glCanvas.style.display = "block";
        renderShader(progPass, texA, texA, 0);

        var tl = gsap.timeline({
          paused: true,
          onUpdate: function () {
            var t = tl.time();
            if (t >= 0.15 && t < 1.85) {
              renderShader(progTrans, texA, texB, easeInOut((t - 0.15) / 1.7));
            } else if (t >= 1.85) {
              renderShader(progPass, texB, texB, 0);
            } else {
              renderShader(progPass, texA, texA, 0);
            }
          },
        });
        tl.to({ v: 0 }, { v: 1, duration: 2, ease: "none" }, 0);
        tl.fromTo(glCanvas, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, 0);
        tl.to(glCanvas, { opacity: 0, duration: 0.25, ease: "power2.in" }, 1.75);
        window.__timelines["flash-through-white"] = tl;
      } // end if (gl)
    </script>
  </body>
