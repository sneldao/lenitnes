<!-- 3D HBAR receipt — built on the ui-3d-reveal 3D-tilt mechanism, on-brand for x402 × Hedera -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>HBAR Receipt 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }

      #rcp-root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: "Inter", sans-serif;
      }
      #rcp-root .rcp-scrim {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, rgba(5,6,12,0.6) 0%, rgba(5,6,12,0.85) 100%);
        opacity: 0;
        pointer-events: none;
      }
      #rcp-root .rcp-stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 2400px;
        perspective-origin: 50% 46%;
      }
      #rcp-root .rcp-glow {
        position: absolute;
        width: 1000px;
        height: 760px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(ellipse at center, rgba(46,204,113,0.16) 0%, transparent 65%);
        filter: blur(46px);
        opacity: 0;
        pointer-events: none;
      }
      #rcp-root .rcp-card {
        width: 780px;
        padding: 46px 54px 40px;
        background: rgba(13,14,26,0.94);
        border: 1px solid rgba(164,162,245,0.3);
        border-radius: 16px;
        box-shadow: 0 60px 140px rgba(0,0,0,0.72), inset 0 1px 0 rgba(255,255,255,0.06);
        background-image: radial-gradient(rgba(164,162,245,0.05) 1px, transparent 1px);
        background-size: 24px 24px;
        transform-style: preserve-3d;
        position: relative;
        will-change: transform, opacity;
      }
      #rcp-root .rcp-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 20px;
      }
      #rcp-root .rcp-title {
        font-family: "JetBrains Mono", monospace;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: rgba(255,255,255,0.85);
      }
      #rcp-root .rcp-status {
        font-family: "JetBrains Mono", monospace;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #2ecc71;
        background: rgba(46,204,113,0.12);
        border: 1px solid rgba(46,204,113,0.4);
        padding: 7px 16px;
        border-radius: 6px;
      }
      #rcp-root .rcp-amount {
        margin: 30px 0 26px;
        font-family: "JetBrains Mono", monospace;
        font-size: 92px;
        font-weight: 700;
        color: #fff;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      #rcp-root .rcp-amount span { font-size: 34px; color: #A4A2F5; margin-left: 12px; }
      #rcp-root .rcp-rows { display: flex; flex-direction: column; gap: 12px; }
      #rcp-root .rcp-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(10,11,22,0.8);
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 9px;
        padding: 15px 20px;
        opacity: 0;
      }
      #rcp-root .rcp-k {
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        color: rgba(255,255,255,0.42);
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      #rcp-root .rcp-v {
        font-family: "JetBrains Mono", monospace;
        font-size: 19px;
        font-weight: 700;
        color: rgba(255,255,255,0.9);
      }
      #rcp-root .rcp-v.accent { color: #A4A2F5; }
      #rcp-root .rcp-foot {
        margin-top: 22px;
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        color: rgba(124,92,252,0.75);
        opacity: 0;
      }
      #rcp-root .rcp-stamp {
        position: absolute;
        top: 150px;
        right: 44px;
        padding: 14px 22px;
        border: 4px solid #2ecc71;
        border-radius: 10px;
        color: #2ecc71;
        font-weight: 900;
        font-size: 40px;
        letter-spacing: 0.06em;
        line-height: 1;
        text-align: center;
        transform: rotate(-12deg);
        box-shadow: 0 0 0 2px rgba(46,204,113,0.25) inset;
        opacity: 0;
        mix-blend-mode: screen;
      }
      #rcp-root .rcp-stamp span {
        display: block;
        margin-top: 8px;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
    </style>
  </head>
  <body>
    <div
      id="rcp-root"
      data-composition-id="hbar-receipt-3d"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="rcpScrim" class="rcp-scrim"></div>
      <div class="rcp-stage">
        <div id="rcpGlow" class="rcp-glow"></div>
        <div id="rcpCard" class="rcp-card">
          <div class="rcp-head">
            <div class="rcp-title">HBAR TRANSFER · RECEIPT</div>
            <div class="rcp-status">✓ SUCCESS</div>
          </div>
          <div class="rcp-amount" id="rcpAmount">0.25<span>HBAR</span></div>
          <div class="rcp-rows">
            <div class="rcp-row" id="rr1"><span class="rcp-k">payer</span><span class="rcp-v">0.0.9832906</span></div>
            <div class="rcp-row" id="rr2"><span class="rcp-k">payee</span><span class="rcp-v accent">0.0.9137770</span></div>
            <div class="rcp-row" id="rr3"><span class="rcp-k">memo</span><span class="rcp-v accent">f5a6b3c4-9e2d-4b7a</span></div>
            <div class="rcp-row" id="rr4"><span class="rcp-k">network</span><span class="rcp-v">hedera:testnet</span></div>
            <div class="rcp-row" id="rr5"><span class="rcp-k">consensus</span><span class="rcp-v">2026-07-30 00:42:07 UTC</span></div>
          </div>
          <div class="rcp-foot" id="rcpFoot">hashscan.io/testnet/tx/0.0.9832906@1785356662</div>
          <div class="rcp-stamp" id="rcpStamp">NOTARIZED<span>HCS · 0.0.9159618</span></div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var tl = gsap.timeline({ paused: true });

        gsap.set("#rcpCard", { rotationY: -38, x: -120, opacity: 0, transformOrigin: "50% 50%" });
        gsap.set("#rcpAmount", { scale: 0.9, opacity: 0 });
        gsap.set("#rcpStamp", { scale: 2.4, rotation: -30, opacity: 0 });

        // Enter: scrim + glow, card swings in from a 3D tilt.
        tl.to("#rcpScrim", { opacity: 1, duration: 0.4, ease: "power2.out" }, 0);
        tl.to("#rcpGlow", { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.1);
        tl.to("#rcpCard", { rotationY: 0, x: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.1);
        tl.to("#rcpAmount", { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.6);

        // Rows stagger in.
        ["#rr1", "#rr2", "#rr3", "#rr4", "#rr5"].forEach(function (id, i) {
          tl.to(id, { opacity: 1, duration: 0.35, ease: "power2.out" }, 1.0 + i * 0.14);
        });

        // Rubber-stamp slam: NOTARIZED hits the receipt, card gives a small thud.
        tl.to("#rcpStamp", { scale: 1, rotation: -12, opacity: 0.92, duration: 0.34, ease: "back.out(2.6)" }, 2.3);
        tl.to("#rcpCard", { scale: 0.985, duration: 0.1, ease: "power2.out" }, 2.3);
        tl.to("#rcpCard", { scale: 1, duration: 0.35, ease: "elastic.out(1, 0.5)" }, 2.4);
        tl.to("#rcpGlow", { opacity: 0.85, scale: 1.1, duration: 0.3, yoyo: true, repeat: 1 }, 2.3);
        tl.to("#rcpFoot", { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.7);

        // Gentle float while the VO lands.
        tl.to("#rcpCard", { rotationY: 2.5, y: -8, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.4);

        // Exit: card tilts away, scrim clears back to the terminal.
        tl.to("#rcpCard", { rotationY: 26, x: 140, opacity: 0, duration: 1.0, ease: "power2.in" }, 8.8);
        tl.to("#rcpGlow", { opacity: 0, duration: 0.9, ease: "power2.in" }, 8.9);
        tl.to("#rcpScrim", { opacity: 0, duration: 1.0, ease: "power2.in" }, 9.0);
        tl.set(["#rcpCard", "#rcpScrim", "#rcpGlow"], { visibility: "hidden" }, 9.9);

        window.__timelines["hbar-receipt-3d"] = tl;
      })();
    </script>
  </body>
</html>
