# LENITNES — full stack for Coolify (Docker Compose deployment).
#
# Services: postgres (db), redis, api, worker, web.
# Secrets and public URLs are supplied via Coolify environment variables.
# SERVICE_FQDN_* are Coolify "magic" vars that auto-generate domains + Traefik
# routing for the exposed services (api on :8742, web on :8743).

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lenitnes}
      # No fallback: a missing POSTGRES_PASSWORD must fail the stack
      # loudly, not quietly provision a DB with a default password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lenitnes}
    volumes:
      - lenitnes-db-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lenitnes} -d ${POSTGRES_DB:-lenitnes}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lenitnes-redis
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    # Loopback-only: 8742 was verified publicly reachable on the VPS
    # (Docker-published ports bypass ufw), which exposed /metrics and
    # the admin surface. Public traffic never uses this port — Traefik
    # routes via the coolify network → web → internal rewrite — so
    # binding to 127.0.0.1 keeps /health + /scorecard reachable for
    # local curl / deploy checks and closes the public path.
    ports:
      - '127.0.0.1:8742:8742'
    environment:
      SERVICE_FQDN_API_8742: ${SERVICE_FQDN_API_8742:-}
      API_PORT: '8742'
      NODE_ENV: production
      # DATABASE_URL is built at runtime by config.ts from POSTGRES_*
      # (see apps/api/src/config.ts → databaseUrlFromPgVars). The
      # .env file on the host may have DATABASE_URL set (for the
      # host's local dev), but the container's POSTGRES_HOST=db
      # wins because the api code prefers the POSTGRES_* build.
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:-lenitnes}
      POSTGRES_USER: ${POSTGRES_USER:-lenitnes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGSSLMODE: disable
      REDIS_HOST: lenitnes-redis
      REDIS_PORT: '6379'
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      HF_QWEN_BASE_URL: ${HF_QWEN_BASE_URL:-https://g9hnto0u7lvbu837.us-east-2.aws.endpoints.huggingface.cloud/v1}
      HF_QWEN_MODEL: ${HF_QWEN_MODEL:-Qwen/Qwen3.8-27B}
      TOKENROUTER_API_KEY: ${TOKENROUTER_API_KEY:-}
      TOKENROUTER_BASE_URL: ${TOKENROUTER_BASE_URL:-https://api.tokenrouter.com/v1}
      TOKENROUTER_MODEL: ${TOKENROUTER_MODEL:-qwen/qwen3.8-max-free}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-hf}
      AGENT_TEMPERATURE: ${AGENT_TEMPERATURE:-0}
      MOCK_AGENT: ${MOCK_AGENT:-0}
      CONVICTION_THRESHOLD: ${CONVICTION_THRESHOLD:-70}
      DAILY_AGENT_BUDGET_USD: ${DAILY_AGENT_BUDGET_USD:-100}
      AGENT_INPUT_COST_PER_1M_USD: ${AGENT_INPUT_COST_PER_1M_USD:-0.15}
      AGENT_OUTPUT_COST_PER_1M_USD: ${AGENT_OUTPUT_COST_PER_1M_USD:-0.60}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      TREASURY_PRIVATE_KEY: ${TREASURY_PRIVATE_KEY}
      TREASURY_MODE: ${TREASURY_MODE:-live}
      TREASURY_DEFAULT_CHAIN: ${TREASURY_DEFAULT_CHAIN:-bnb}
      TREASURY_DEFAULT_AMOUNT: ${TREASURY_DEFAULT_AMOUNT:-0.01}
      TREASURY_SLIPPAGE_BPS: ${TREASURY_SLIPPAGE_BPS:-50}
      TREASURY_DEFAULT_TOKEN_IN: ${TREASURY_DEFAULT_TOKEN_IN:-0xUSDC_PLACEHOLDER}
      TRADING_ENABLED: ${TRADING_ENABLED:-false}
      # ── Propr (Hyperliquid perps: live shorts + L1 assets) ──
      # Gated behind BOTH TRADING_ENABLED + PROPR_ENABLED (both default
      # off). PROPR_API_KEY must be set when PROPR_ENABLED=true (enforced
      # by config-schema.ts superRefine). Get a key at app.propr.xyz/settings.
      PROPR_ENABLED: ${PROPR_ENABLED:-false}
      PROPR_API_KEY: ${PROPR_API_KEY:-}
      PROPR_API_URL: ${PROPR_API_URL:-https://api.propr.xyz/v1}
      PROPR_WS_URL: ${PROPR_WS_URL:-wss://api.propr.xyz/ws}
      PROPR_ACCOUNT_ID: ${PROPR_ACCOUNT_ID:-}
      PROPR_MIN_NOTIONAL_USD: ${PROPR_MIN_NOTIONAL_USD:-20}
      PROPR_MAX_NOTIONAL_USD: ${PROPR_MAX_NOTIONAL_USD:-500}
      PROPR_LEVERAGE: ${PROPR_LEVERAGE:-1}
      PROPR_SL_TP_ENABLED: ${PROPR_SL_TP_ENABLED:-true}
      PROPR_NOTARIZE: ${PROPR_NOTARIZE:-true}
      ARBITRUM_RPC_URL: ${ARBITRUM_RPC_URL:-https://sepolia-rollup.arbitrum.io/rpc}
      ARB_SIGNAL_REGISTRY_ADDRESS: ${ARB_SIGNAL_REGISTRY_ADDRESS:-}
      ARB_TRADE_EXECUTOR_ADDRESS: ${ARB_TRADE_EXECUTOR_ADDRESS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_PUBLIC_CHANNEL_ID: ${TELEGRAM_PUBLIC_CHANNEL_ID:-}
      TINYFISH_API_KEY: ${TINYFISH_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PROOF_MODE: ${PROOF_MODE:-hedera}
      SOSO_VALUE_API_KEY: ${SOSO_VALUE_API_KEY:-}
      SODEX_API_KEY_NAME: ${SODEX_API_KEY_NAME:-}
      SODEX_API_KEY_PRIVATE: ${SODEX_API_KEY_PRIVATE:-}
      SODEX_ACCOUNT_ID: ${SODEX_ACCOUNT_ID:-}
      SODEX_SYMBOL: ${SODEX_SYMBOL:-}
      SODEX_NETWORK: ${SODEX_NETWORK:-}
    volumes:
      - twak-data:/home/node/.twak
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      RUN_RESPONSIVENESS_SWEEPS: '1'
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:-lenitnes}
      POSTGRES_USER: ${POSTGRES_USER:-lenitnes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGSSLMODE: disable
      REDIS_HOST: lenitnes-redis
      REDIS_PORT: '6379'
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      HF_QWEN_BASE_URL: ${HF_QWEN_BASE_URL:-https://g9hnto0u7lvbu837.us-east-2.aws.endpoints.huggingface.cloud/v1}
      HF_QWEN_MODEL: ${HF_QWEN_MODEL:-Qwen/Qwen3.8-27B}
      TOKENROUTER_API_KEY: ${TOKENROUTER_API_KEY:-}
      TOKENROUTER_BASE_URL: ${TOKENROUTER_BASE_URL:-https://api.tokenrouter.com/v1}
      TOKENROUTER_MODEL: ${TOKENROUTER_MODEL:-qwen/qwen3.8-max-free}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-hf}
      AGENT_TEMPERATURE: ${AGENT_TEMPERATURE:-0}
      MOCK_AGENT: ${MOCK_AGENT:-0}
      CONVICTION_THRESHOLD: ${CONVICTION_THRESHOLD:-70}
      DAILY_AGENT_BUDGET_USD: ${DAILY_AGENT_BUDGET_USD:-100}
      AGENT_INPUT_COST_PER_1M_USD: ${AGENT_INPUT_COST_PER_1M_USD:-0.15}
      AGENT_OUTPUT_COST_PER_1M_USD: ${AGENT_OUTPUT_COST_PER_1M_USD:-0.60}
      TREASURY_PRIVATE_KEY: ${TREASURY_PRIVATE_KEY}
      TREASURY_MODE: ${TREASURY_MODE:-live}
      TRADING_ENABLED: ${TRADING_ENABLED:-false}
      # ── Propr (Hyperliquid perps: live shorts + L1 assets) ──
      PROPR_ENABLED: ${PROPR_ENABLED:-false}
      PROPR_API_KEY: ${PROPR_API_KEY:-}
      PROPR_API_URL: ${PROPR_API_URL:-https://api.propr.xyz/v1}
      PROPR_WS_URL: ${PROPR_WS_URL:-wss://api.propr.xyz/ws}
      PROPR_ACCOUNT_ID: ${PROPR_ACCOUNT_ID:-}
      PROPR_MIN_NOTIONAL_USD: ${PROPR_MIN_NOTIONAL_USD:-20}
      PROPR_MAX_NOTIONAL_USD: ${PROPR_MAX_NOTIONAL_USD:-500}
      PROPR_LEVERAGE: ${PROPR_LEVERAGE:-1}
      PROPR_SL_TP_ENABLED: ${PROPR_SL_TP_ENABLED:-true}
      PROPR_NOTARIZE: ${PROPR_NOTARIZE:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TINYFISH_API_KEY: ${TINYFISH_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PROOF_MODE: ${PROOF_MODE:-hedera}
      SOSO_VALUE_API_KEY: ${SOSO_VALUE_API_KEY:-}
      SODEX_API_KEY_NAME: ${SODEX_API_KEY_NAME:-}
      SODEX_API_KEY_PRIVATE: ${SODEX_API_KEY_PRIVATE:-}
      SODEX_ACCOUNT_ID: ${SODEX_ACCOUNT_ID:-}
      SODEX_SYMBOL: ${SODEX_SYMBOL:-}
      SODEX_NETWORK: ${SODEX_NETWORK:-}
    volumes:
      - twak-data:/home/node/.twak
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    networks:
      - default
      - coolify
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=coolify'
      - 'traefik.http.routers.lenitnes-web.rule=Host(`lenitnes.persidian.com`)'
      - 'traefik.http.routers.lenitnes-web.priority=50'
      - 'traefik.http.routers.lenitnes-web.entrypoints=https'
      - 'traefik.http.routers.lenitnes-web.tls.certresolver=letsencrypt'
      - 'traefik.http.services.lenitnes-web.loadbalancer.server.port=3000'
    ports:
      - '127.0.0.1:8743:3000'
    environment:
      - SERVICE_FQDN_WEB_8743
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - api

networks:
  coolify:
    external: true

volumes:
  lenitnes-db-data:
  twak-data:
