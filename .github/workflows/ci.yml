name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify lockfile (npm ci)
        run: npm ci

      - name: Build shared types
        run: npm run build --workspace=@lenitnes/types

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
